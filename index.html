    <script>
      (() => {
        try {
          const saved = localStorage.getItem("rosic-theme");
          const theme = saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            theme === "dark" ? "#151c15" : "#fafaf5",
          );
        } catch {
          /* Keep the light brand presentation when storage is unavailable. */
        }
        try {
          // Declare the visitor's chosen language before the first paint, so
          // the browser's own translator knows what the page is written in.
          const language = localStorage.getItem("rosic-language");
          if (/^(vi|en|zh|ko|ja|ar|fr|de)$/.test(language || "")) {
            document.documentElement.lang = language;
            document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
          }
        } catch {
          /* Vietnamese stays declared. */
        }
      })();
    </script>
