<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08172b" />
      <stop offset="100%" stop-color="#0d2137" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d423" />
      <stop offset="50%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer orbital ring (Global) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Heart & Leaves Emblem (Hong Tam) -->
  <g transform="translate(32, 32) scale(1.15)">
    <!-- Heart curve outer leaf -->
    <path d="M0,8 C-7,4 -15,-3 -13,-12 C-11,-19 -2,-17 0,-9 C2,-17 11,-19 13,-12 C15,-3 7,4 0,8 Z"
          fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Inner Sprout (Green Nature) -->
    <path d="M0,5 C-4,1 -8,-4 -7,-9 C-6,-13 -1,-11 0,-6 C1,-11 6,-13 7,-9 C8,-4 4,1 0,5 Z"
          fill="url(#leafGrad)" />
          
    <!-- Stem & Sun Core -->
    <circle cx="0" cy="-6" r="2.2" fill="#ffffff" />
    <path d="M0,5 L0,12" stroke="#e9c46a" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>